[project]
name = "vidmux"
version = "0.2.1"
description = "Inspect and modify video/audio/subtitle tracks using FFmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [{name = "Philipp Meder", email = "148459685+PhilippMeder@users.noreply.github.com"}]
maintainers = [{name = "Philipp Meder", email = "148459685+PhilippMeder@users.noreply.github.com"}]

dependencies = []

keywords = [
    "media",
    "video",
    "inspect",
    "mux",
    "audio tracks",
    "cli",
    "subtitles",
    "movie library"
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

[project.urls]
Changelog = "https://github.com/PhilippMeder/vidmux/commits"
Documentation = "https://github.com/PhilippMeder/vidmux/README.md"
Download = "https://github.com/PhilippMeder/vidmux"
Homepage = "https://github.com/PhilippMeder/vidmux"
Issues = "https://github.com/PhilippMeder/vidmux/issues"
Releasenotes = "https://github.com/PhilippMeder/vidmux/commits"
Source = "https://github.com/PhilippMeder/vidmux.git"

[project.scripts]
vidmux = "vidmux.__main__:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.vidmux]
system-dependencies = ["ffmpeg>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vidmux --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["./*"]
omit = ["tests/*", "src/vidmux/_legacy/*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    # correctness / core issues
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings

    # naming / structure
    "N",    # naming conventions

    # imports / formatting logic
    "I",    # isort

    # typing
    "ANN",  # annotations

    # modern Python upgrades
    "UP",   # pyupgrade

    # code quality / simplification
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplification
    "ARG",  # unused arguments

    # design / maintainability opinions
    "PL",   # pylint rules
    "TRY",  # exception handling

    # filesystem / style preferences
    "PTH",  # pathlib usage

    # documentation
    "D",    # docstrings

    # cleanup / hygiene
    "ERA",  # dead/commented code

    # performance
    "PERF", # performance hints

    # Ruff-specific extras
    "RUF",  # Ruff-specific rules
]

ignore = [
    # documentation
    "D203", # incompatible with D211
    "D213", # numpy style prefers D212

    # magic value findings (resolution check uses plain numbers)
    "PLR2004",
]

fixable = [
    # whitespace + formatting issues
    "E",
    "W",

    # basic correctness fixes
    "F",

    # safe modernization of syntax
    "UP",

    # comprehension simplifications
    "C4",

    # safe code simplifications
    "SIM",

    # Ruff-specific safe fixes
    "RUF",
]

unfixable = [
    # imports are intentionally NOT auto-rewritten
    # reason: import order changes can obscure module dependency issues (prefer explicit control)
    "I",
]

[tool.ruff.lint.per-file-ignores]
# Ignore some rules for tests
"tests/**/*.py" = [
    "ANN001",   # don't require annotations, esp. for pytest fixtures
    "ERA001",   # keep commented-out code for dev testing
    "SIM117"    # nested contexts make it clearer to the reader what's happening
]


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
